# Secret scanning and repository hygiene. Runs on every push of every branch
# (Bots push at least every 2 hours) and on every PR. A weekly full-history
# scan feeds the Coordinator's AUDIT. Findings fail the check; gitleaks output
# is redacted. Config: .gitleaks.toml. Policy: governance/SECURITY_CHECKLIST.md §1.
name: secret-scan

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC: full-history scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_COMMENTS: "false"
          # GITLEAKS_LICENSE is only required for organization-owned repositories.

  repo-hygiene:
    name: repo hygiene (env files, keys, raw media, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No committed .env files (only .env.example)
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Committed env files found (secrets never enter the repo):"
            echo "$bad"
            exit 1
          fi
          echo "OK: no .env files tracked"
      - name: No private keys, certificates, or provisioning profiles
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -iE '\.(pem|p12|pfx|p8|jks|keystore|mobileprovision)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Key or certificate files tracked:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no key material tracked"
      - name: No raw media or scan corpus files
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -iE '\.(mp4|mov|m4v|heic|ply|splat|spz|ksplat)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Raw media or scan files tracked (privacy and size; see .gitignore):"
            echo "$bad"
            exit 1
          fi
          echo "OK: no raw media tracked"
      - name: No files over 50 MB (warn over 10 MB)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            s=$(stat -c%s "$f")
            if [ "$s" -gt 52428800 ]; then
              echo "::error file=$f::$((s / 1048576)) MB exceeds the 50 MB limit"
              fail=1
            elif [ "$s" -gt 10485760 ]; then
              echo "::warning file=$f::$((s / 1048576)) MB; consider Git LFS or keep it out of the repo"
            fi
          done < <(git ls-files)
          exit "$fail"

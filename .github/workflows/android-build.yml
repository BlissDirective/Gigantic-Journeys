# Headless Android build (debug APK) via game-ci/unity-builder.
# v1 ships on the iOS App Store only (AUTH #003). This job runs ON DEMAND only,
# as a portability check that keeps the Android target compiling for v1.1. Preflight skips (green, with a reason) until the
# Unity project exists, UNITY_CI_ENABLED is "true", and UNITY_EMAIL + UNITY_PASSWORD exist. Release signing (keystore secrets)
# is added at M5 under its own AUTH; until then the build is debug-signed.
name: android-build

on:
  workflow_dispatch:

permissions:
  contents: read

# One Unity sign-in at a time across all Unity workflows.
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
      reason: ${{ steps.p.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
          HAS_LOGIN: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ ! -f unity/ProjectSettings/ProjectVersion.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no Unity project yet (ticket M0-UNITY-01)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_ENABLED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=repository variable UNITY_CI_ENABLED is not true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_LOGIN" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=UNITY_EMAIL + UNITY_PASSWORD not configured; a machine-bound UNITY_LICENSE cannot activate on hosted runners (ticket M0-REPO-03)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=project, switch, and Unity login present" >> "$GITHUB_OUTPUT"
      - run: echo "::notice::android-build ${{ steps.p.outputs.run == 'true' && 'will run' || format('skipped — {0}', steps.p.outputs.reason) }}"

  build:
    name: Android APK (debug)
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-android-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-android-
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: Android
          buildName: GiganticJourneys
          androidExportType: androidPackage
          versioning: Semantic
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/Android
          retention-days: 14

  gate:
    name: android build gate
    needs: [preflight, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.preflight.outputs.run }}" != "true" ]; then
            echo "skipped: ${{ needs.preflight.outputs.reason }}"
            exit 0
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Android build failed (${{ needs.build.result }})"
            exit 1
          fi
          echo "android build: OK"

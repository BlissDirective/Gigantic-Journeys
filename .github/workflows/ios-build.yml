# iOS build in two stages: Unity exports the Xcode project on Linux (game-ci),
# then a macOS runner archives it. Because this repository is public,
# GitHub-hosted macOS runners are free and unmetered, so no Mac mini is
# required for CI. If the repository ever goes private, macOS minutes bill at
# about 10x Linux and a self-hosted Mac becomes the cheaper path: set the
# repository variable IOS_MAC_RUNNER to that runner's label (for example
# "gj-ios") to switch; leave it unset to use GitHub's macos-14.
#
# Two macOS lanes, chosen by the repository variable TESTFLIGHT_ENABLED:
#   - unset/false: unsigned build (compile check only)
#   - true: signed archive with Xcode cloud-managed signing using the App Store
#     Connect API key, export, and TestFlight upload through fastlane pilot.
#     Internal testers with automatic distribution receive every build.
# Secrets (CI-only, added by the Owner, ticket M0-REPO-05): ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8_BASE64. Variable: APPLE_TEAM_ID.
# The build number is the workflow run number. gj-qa-release verifies the
# lane on its first real run (M1) and records findings in qa/.
#
# Preflight skips (green, with a reason) until the Unity project and license
# secrets exist. Never put a key value in this file or in a log.
name: ios-build

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "config/movement.json"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
      reason: ${{ steps.p.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' || (secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' && secrets.UNITY_SERIAL != '') }}
        run: |
          set -euo pipefail
          if [ ! -f unity/ProjectSettings/ProjectVersion.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no Unity project yet (ticket M0-UNITY-01)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=Unity license secrets not configured (ticket M0-REPO-03)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=project and license present" >> "$GITHUB_OUTPUT"
      - run: echo "::notice::ios-build ${{ steps.p.outputs.run == 'true' && 'will run' || format('skipped — {0}', steps.p.outputs.reason) }}"

  export:
    name: Unity iOS export (Xcode project, Linux)
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-ios-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-ios-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: iOS
          buildName: GiganticJourneys
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 3

  archive:
    name: xcodebuild (unsigned, macOS)
    needs: export
    if: vars.TESTFLIGHT_ENABLED != 'true'
    runs-on: ${{ vars.IOS_MAC_RUNNER || 'macos-14' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
      - name: xcodebuild (unsigned compile check)
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  testflight:
    name: signed archive + TestFlight upload (macOS)
    needs: export
    if: vars.TESTFLIGHT_ENABLED == 'true'
    runs-on: ${{ vars.IOS_MAC_RUNNER || 'macos-14' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
      - name: Install the App Store Connect API key (never printed)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8_BASE64" && test -n "$APPLE_TEAM_ID" \
            || { echo "::error::ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (secrets) and APPLE_TEAM_ID (variable) are required (ticket M0-REPO-05)"; exit 1; }
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - <<'PY'
          import base64, json, os
          key = base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": key, "in_house": False},
                    open(os.path.expanduser("~/private_keys/asc_api_key.json"), "w"))
          PY
          chmod 600 "$HOME/private_keys/asc_api_key.json"
      - name: Set the build number
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist || echo "::warning::could not set CFBundleVersion in Info.plist; gj-qa-release to confirm the build-number path on first run"
      - name: Archive with cloud-managed signing
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath ../GiganticJourneys.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic
      - name: Export the .ipa
        run: |
          set -euo pipefail
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/iOS/GiganticJourneys.xcarchive \
            -exportPath build/iOS/export -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight (fastlane pilot)
        run: |
          set -euo pipefail
          ipa=$(ls build/iOS/export/*.ipa | head -n1)
          fastlane pilot upload --api_key_path "$HOME/private_keys/asc_api_key.json" --ipa "$ipa" \
            --skip_waiting_for_build_processing true --skip_submission true
      - name: Remove the key material
        if: always()
        run: rm -rf "$HOME/private_keys"

  gate:
    name: ios build gate
    needs: [preflight, export, archive, testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.preflight.outputs.run }}" != "true" ]; then
            echo "skipped: ${{ needs.preflight.outputs.reason }}"
            exit 0
          fi
          if [ "${{ needs.export.result }}" != "success" ]; then
            echo "::error::Unity iOS export failed (${{ needs.export.result }})"
            exit 1
          fi
          case "${{ needs.archive.result }}/${{ needs.testflight.result }}" in
            success/skipped|skipped/success) echo "ios build: OK" ;;
            *) echo "::error::macOS lane failed (archive=${{ needs.archive.result }}, testflight=${{ needs.testflight.result }})"; exit 1 ;;
          esac

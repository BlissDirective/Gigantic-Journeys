# iOS build in two stages: Unity exports the Xcode project on Linux (game-ci),
# then a macOS runner archives it. Because this repository is public,
# GitHub-hosted macOS runners are free and unmetered, so no Mac mini is
# required for CI. If the repository ever goes private, macOS minutes bill at
# about 10x Linux and a self-hosted Mac becomes the cheaper path: set the
# repository variable IOS_MAC_RUNNER to that runner's label (for example
# "gj-ios") to switch; leave it unset to use GitHub's macos-26.
#
# Xcode / SDK: App Store Connect rejects uploads built with an SDK older than
# iOS 26 ("SDK version issue", TestFlight runs 36577265750 and 36760847904 on
# macos-14 / Xcode 15.4), so every macOS job runs on macos-26 and selects an
# Xcode whose iphoneos SDK is >= 26 (repository variable IOS_XCODE_APP may pin
# an exact path, for example /Applications/Xcode_26.6.app). macos-14 images
# are unsupported after 2026-11-02 anyway.
#
# Lanes (ticket M3-UNITY-01 for Burst):
#   - Linux export lane (every push to main, or dispatch with lane=linux): the
#     fast compile check. game-ci exports the Xcode project on Linux with
#     Burst OFF for that build only (customParameters -gjIosBurstOff, handled
#     by unity/Assets/Editor/Build/IosBurstBuildHook.cs), then a macOS runner
#     runs an unsigned xcodebuild.
#   - macOS player lane (dispatch with lane=macos, the default, and every run
#     while TESTFLIGHT_ENABLED is "true"): game-ci runs the Unity iOS player
#     build natively on a macOS runner with the committed Burst state
#     (ProjectSettings/BurstAotSettings_iOS.json, ENABLED), asserts the Burst
#     library is in the Xcode project, and runs an unsigned xcodebuild. This is
#     the lane for perf and TestFlight builds.
#   - TestFlight (TESTFLIGHT_ENABLED "true"): signed archive of the macOS
#     player lane's Xcode project with Xcode cloud-managed signing using the
#     App Store Connect API key, export, and upload through fastlane pilot.
#     Internal testers with automatic distribution receive every build.
# Flavors (macOS lane; dispatch input "flavor", ticket M0-UNITY-04 AT-1):
#   - release (default, and every push): the debug overlay must be ABSENT from
#     the Xcode project (checked by .github/scripts/ios_debug_flavor.py;
#     SECURITY_CHECKLIST 9.7/9.8).
#   - internal-debug: adds the GJ_DEBUG scripting define in this runner's
#     checkout only (committed ProjectSettings stay release-clean), asserts the
#     overlay + share-sheet plugin are PRESENT, and exports the build as
#     TestFlight internal-testing-only (testFlightInternalTestingOnly), so it can
#     never be submitted to App Review or external testers. Same bundle ID and
#     app record; the Owner installs it from TestFlight like any other build.
#     It also appends the device-test scene Assets/Scenes/DeviceTest/SplatRoom.unity
#     to the build list (reachable from the overlay's scene switcher), and when
#     the dispatch input splat_url is set, fetches the converted corpus splat
#     (M1-UNITY-01 AT-2/AT-3) from the PRIVATE staging bucket through that
#     short-lived (<=15 min) signed URL, verifies its SHA-256 against
#     unity/Assets/GiganticJourneys/DeviceTest/splat-room.json and unpacks it
#     into a gitignored Resources folder. The URL is read from the event file
#     and masked (never echoed); no key is used here. Release builds contain
#     neither the scene nor the splat (checked on the exported player data).
#     A second room (splat_url_2 + splat_room_2, e.g. the Owner's own-room test
#     capture, AUTH #046) is fetched the same way against
#     DeviceTest/splat-room-<splat_room_2>.json; the overlay offers it as a
#     SplatRoom variant. Internal-debug runs only RESTORE the Library cache and
#     never save it, so no imported splat ever lands in the Actions cache.
#     AUTH #047 / #046: when splat_url or splat_url_2 was set, the Xcode project
#     holds private splat packages. The macos-player job still uploads
#     ios-xcode-project-burst for the TestFlight job (retention-days: 1), and
#     the TestFlight job deletes that artifact as soon as it is done with it
#     (success or failure), so a public-repo Actions artifact never keeps the
#     private packages. Release builds keep retention-days: 3 and no delete.
# Secrets (CI-only, added by the Owner, ticket M0-REPO-05): ASC_KEY_ID,
# ASC_ISSUER_ID, ASC_KEY_P8_BASE64. Variable: APPLE_TEAM_ID.
# The build number is the workflow run number. gj-qa-release verifies the
# lane on its first real run (M1) and records findings in qa/.
#
# Preflight skips (green, with a reason) until the Unity project exists, the
# repository variable UNITY_CI_ENABLED is "true", and UNITY_EMAIL +
# UNITY_PASSWORD exist (see unity-tests.yml for why a .ulf alone is not enough). Never put a key value in this file or in a log.
name: ios-build

on:
  push:
    branches: [main]
    paths:
      - "unity/**"
      - "config/movement.json"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      lane:
        description: "macos = Unity iOS player build on macOS with Burst AOT on (perf/TestFlight); linux = fast Linux export compile check (Burst off)"
        type: choice
        options: [macos, linux]
        default: macos
      flavor:
        description: "release = App Store build, overlay compiled out; internal-debug = GJ_DEBUG build with the debug overlay, uploaded (when TestFlight is on) as internal-testing-only"
        type: choice
        options: [release, internal-debug]
        default: release
      splat_url:
        description: "internal-debug only: short-lived (<=15 min) signed URL of the device-test splat package (M1-UNITY-01), minted by gj-operator from the private staging bucket right before dispatch; empty = no splat"
        type: string
        default: ""
      splat_url_2:
        description: "internal-debug only: short-lived (<=15 min) signed URL of a second device-test room package (manifest DeviceTest/splat-room-<splat_room_2>.json); empty = none"
        type: string
        default: ""
      splat_room_2:
        description: "slug of the second room (lowercase letters, digits, dashes)"
        type: string
        default: "owner-room-01"

permissions:
  contents: read
  # AUTH #047: the TestFlight job deletes ios-xcode-project-burst when this run
  # fetched private splat packages (splat_url / splat_url_2).
  actions: write

# One Unity sign-in at a time across all Unity workflows.
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.p.outputs.run }}
      reason: ${{ steps.p.outputs.reason }}
      linux: ${{ steps.lanes.outputs.linux }}
      macos: ${{ steps.lanes.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        env:
          CI_ENABLED: ${{ vars.UNITY_CI_ENABLED }}
          HAS_LOGIN: ${{ secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          if [ ! -f unity/ProjectSettings/ProjectVersion.txt ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no Unity project yet (ticket M0-UNITY-01)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CI_ENABLED" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=repository variable UNITY_CI_ENABLED is not true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HAS_LOGIN" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=UNITY_EMAIL + UNITY_PASSWORD not configured; a machine-bound UNITY_LICENSE cannot activate on hosted runners (ticket M0-REPO-03)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=project, switch, and Unity login present" >> "$GITHUB_OUTPUT"
      - id: lanes
        env:
          EVENT: ${{ github.event_name }}
          LANE: ${{ inputs.lane }}
          TESTFLIGHT: ${{ vars.TESTFLIGHT_ENABLED }}
        run: |
          set -euo pipefail
          linux=false; macos=false
          if [ "$EVENT" = "push" ] || [ "$LANE" = "linux" ]; then linux=true; fi
          if [ "$LANE" = "macos" ] || [ "$TESTFLIGHT" = "true" ]; then macos=true; fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "lanes: linux export=$linux, macOS player (Burst on)=$macos"
      - run: echo "::notice::ios-build ${{ steps.p.outputs.run == 'true' && 'will run' || format('skipped — {0}', steps.p.outputs.reason) }}"

  export:
    name: Unity iOS export (Xcode project, Linux)
    needs: preflight
    if: needs.preflight.outputs.run == 'true' && needs.preflight.outputs.linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc || true
          df -h /
      - uses: actions/cache@v6
        with:
          path: unity/Library
          key: Library-ios-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            Library-ios-
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: unity
          targetPlatform: iOS
          buildName: GiganticJourneys
          # Burst off for this compile-check export only (M3-UNITY-01); the
          # committed iOS Burst state stays ENABLED. See the [GJ-BURST] log line.
          customParameters: -gjIosBurstOff
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
          retention-days: 3

  archive:
    name: xcodebuild (unsigned, macOS)
    needs: export
    runs-on: ${{ vars.IOS_MAC_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project
          path: build/iOS
      - name: Select Xcode with the iOS 26+ SDK (App Store Connect minimum)
        env:
          IOS_XCODE_APP: ${{ vars.IOS_XCODE_APP }}
        run: |
          set -euo pipefail
          app="${IOS_XCODE_APP:-}"
          if [ -z "$app" ]; then app=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          major=${sdk%%.*}
          if [ "$major" -lt 26 ]; then
            echo "::error::iphoneos SDK $sdk < 26: App Store Connect rejects it. Set IOS_XCODE_APP to an Xcode 26+ app path."
            exit 1
          fi
          echo "::notice::Xcode $(xcodebuild -version | head -n1), iphoneos SDK $sdk"
      - name: xcodebuild (unsigned compile check)
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  macos-player:
    name: Unity iOS player build (macOS, Burst AOT on) + unsigned xcodebuild
    # After the Linux export so only one Unity activation runs at a time.
    needs: [preflight, export]
    if: ${{ !cancelled() && needs.preflight.outputs.run == 'true' && needs.preflight.outputs.macos == 'true' }}
    runs-on: ${{ vars.IOS_MAC_RUNNER || 'macos-26' }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      # First, while the signed URL is still valid. The input is read from the event
      # file and masked, so the URL never appears in this public log.
      - name: Internal-debug fetches the device-test splat room (signed URL, SHA-256 verified)
        if: ${{ inputs.flavor == 'internal-debug' && inputs.splat_url != '' }}
        run: |
          set -euo pipefail
          url=$(jq -r '.inputs.splat_url // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$url"
          pkg="$RUNNER_TEMP/splat-room.tar.gz"
          curl -fsS --retry 2 --max-filesize 67108864 -o "$pkg" "$url"
          python3 .github/scripts/ios_debug_flavor.py fetch-splat --file "$pkg" \
            --manifest unity/Assets/GiganticJourneys/DeviceTest/splat-room.json \
            --dest unity/Assets/GiganticJourneys/DeviceTest/Downloaded/Resources/GJSplatRoom
      - name: Internal-debug fetches the second device-test room (signed URL, SHA-256 verified)
        if: ${{ inputs.flavor == 'internal-debug' && inputs.splat_url_2 != '' }}
        run: |
          set -euo pipefail
          url=$(jq -r '.inputs.splat_url_2 // ""' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$url"
          room=$(jq -r '.inputs.splat_room_2 // ""' "$GITHUB_EVENT_PATH")
          [[ "$room" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "::error::bad splat_room_2"; exit 1; }
          pkg="$RUNNER_TEMP/splat-room-2.tar.gz"
          curl -fsS --retry 2 --max-filesize 67108864 -o "$pkg" "$url"
          python3 .github/scripts/ios_debug_flavor.py fetch-splat --file "$pkg" \
            --manifest "unity/Assets/GiganticJourneys/DeviceTest/splat-room-$room.json" \
            --dest unity/Assets/GiganticJourneys/DeviceTest/Downloaded/Resources/GJSplatRoom
          rm -f "$pkg"
      # Release / push builds restore and save the Library cache; internal-debug builds
      # (which import the private device-test splats) only restore it.
      - if: ${{ inputs.flavor != 'internal-debug' }}
        uses: actions/cache@v6
        with:
          path: unity/Library
          key: LibraryMac-ios-${{ inputs.flavor == 'internal-debug' && 'debug-' || '' }}${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            LibraryMac-ios-
      - if: ${{ inputs.flavor == 'internal-debug' }}
        uses: actions/cache/restore@v6
        with:
          path: unity/Library
          key: LibraryMac-ios-debug-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**') }}
          restore-keys: |
            LibraryMac-ios-
      - name: Internal-debug flavor adds GJ_DEBUG (this runner's checkout only)
        if: ${{ inputs.flavor == 'internal-debug' }}
        run: python3 .github/scripts/ios_debug_flavor.py add-define unity/ProjectSettings/ProjectSettings.asset
      - name: Internal-debug adds the SplatRoom device-test scene to the build list (this runner's checkout only)
        if: ${{ inputs.flavor == 'internal-debug' }}
        run: python3 .github/scripts/ios_debug_flavor.py add-scene unity/ProjectSettings/EditorBuildSettings.asset Assets/Scenes/DeviceTest/SplatRoom.unity
      - name: Committed iOS Burst state must be ENABLED
        run: |
          set -euo pipefail
          grep -Eq '"EnableBurstCompilation"[[:space:]]*:[[:space:]]*true' unity/ProjectSettings/BurstAotSettings_iOS.json \
            || { echo "::error::unity/ProjectSettings/BurstAotSettings_iOS.json must have EnableBurstCompilation true (M3-UNITY-01)"; exit 1; }
          echo "[GJ-BURST] committed iOS Burst state: ENABLED"
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          # The Package Manager server (embedded Node) aborts with "async hook
          # stack has become corrupted" during the first package resolve on
          # GitHub macOS runners; skip Node's strict async-hook check.
          NODE_OPTIONS: --no-force-async-hooks-checks
        with:
          projectPath: unity
          targetPlatform: iOS
          buildName: GiganticJourneys
          cacheUnityInstallationOnMac: true
          # internal-debug edits ProjectSettings.asset in this checkout (GJ_DEBUG),
          # which game-ci's semantic versioning otherwise rejects as a dirty branch.
          allowDirtyBuild: ${{ inputs.flavor == 'internal-debug' }}
      - name: Burst AOT library is in the Xcode project
        run: |
          set -euo pipefail
          lib=build/iOS/GiganticJourneys/Libraries/lib_burst_generated.a
          test -s "$lib" || { echo "::error::$lib missing or empty: Burst AOT did not run (M3-UNITY-01)"; exit 1; }
          size=$(stat -f %z "$lib")
          syms=$(nm -gU "$lib" 2>/dev/null | grep -c ' T ' || true)
          lipo -info "$lib" || true
          echo "[GJ-BURST] Burst AOT ENABLED: $lib is $size bytes with $syms exported code symbols"
          echo "::notice::Burst AOT ENABLED: lib_burst_generated.a $size bytes, $syms code symbols"
      - name: Debug overlay present only in the internal-debug flavor
        env:
          EXPECT: ${{ inputs.flavor == 'internal-debug' && 'present' || 'absent' }}
        run: python3 .github/scripts/ios_debug_flavor.py check build/iOS/GiganticJourneys --expect "$EXPECT"
      - name: Device-test scene and splat only in the internal-debug flavor
        env:
          SCENE: ${{ inputs.flavor == 'internal-debug' && 'present' || 'absent' }}
          SPLAT: ${{ inputs.flavor == 'internal-debug' && inputs.splat_url != '' && 'present' || 'absent' }}
        run: python3 .github/scripts/ios_debug_flavor.py check-device-test build/iOS/GiganticJourneys --scene "$SCENE" --splat "$SPLAT"
      - name: Second device-test room only in the internal-debug flavor
        env:
          SCENE: ${{ inputs.flavor == 'internal-debug' && 'present' || 'absent' }}
          SPLAT: ${{ inputs.flavor == 'internal-debug' && inputs.splat_url_2 != '' && 'present' || 'absent' }}
        run: |
          set -euo pipefail
          room=$(jq -r '.inputs.splat_room_2 // "owner-room-01"' "$GITHUB_EVENT_PATH")
          [[ "$room" =~ ^[a-z0-9][a-z0-9-]{0,40}$ ]] || { echo "::error::bad splat_room_2"; exit 1; }
          python3 .github/scripts/ios_debug_flavor.py check-device-test build/iOS/GiganticJourneys --scene "$SCENE" --splat "$SPLAT" --slug "$room"
      - name: App Store (1024 px, opaque) icon is in the Xcode project
        run: python3 .github/scripts/ios_app_icon.py build/iOS/GiganticJourneys
      - name: Select Xcode with the iOS 26+ SDK (App Store Connect minimum)
        env:
          IOS_XCODE_APP: ${{ vars.IOS_XCODE_APP }}
        run: |
          set -euo pipefail
          app="${IOS_XCODE_APP:-}"
          if [ -z "$app" ]; then app=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          major=${sdk%%.*}
          if [ "$major" -lt 26 ]; then
            echo "::error::iphoneos SDK $sdk < 26: App Store Connect rejects it. Set IOS_XCODE_APP to an Xcode 26+ app path."
            exit 1
          fi
          echo "::notice::Xcode $(xcodebuild -version | head -n1), iphoneos SDK $sdk"
      - name: xcodebuild (unsigned compile check)
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-project-burst
          path: |
            build/iOS
            !build/iOS/DerivedData
          # AUTH #047: 1 day when private splat packages were fetched (defense in
          # depth; the TestFlight job also deletes the artifact when done).
          retention-days: ${{ (inputs.flavor == 'internal-debug' && (inputs.splat_url != '' || inputs.splat_url_2 != '')) && 1 || 3 }}

  testflight:
    name: signed archive + TestFlight upload (macOS)
    needs: macos-player
    if: ${{ !cancelled() && vars.TESTFLIGHT_ENABLED == 'true' && needs.macos-player.result == 'success' }}
    runs-on: ${{ vars.IOS_MAC_RUNNER || 'macos-26' }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      FLAVOR: ${{ inputs.flavor || 'release' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-xcode-project-burst
          path: build/iOS
      - name: Select Xcode with the iOS 26+ SDK (App Store Connect minimum)
        env:
          IOS_XCODE_APP: ${{ vars.IOS_XCODE_APP }}
        run: |
          set -euo pipefail
          app="${IOS_XCODE_APP:-}"
          if [ -z "$app" ]; then app=$(xcode-select -p | sed 's#/Contents/Developer$##'); fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          major=${sdk%%.*}
          if [ "$major" -lt 26 ]; then
            echo "::error::iphoneos SDK $sdk < 26: App Store Connect rejects it. Set IOS_XCODE_APP to an Xcode 26+ app path."
            exit 1
          fi
          echo "::notice::Xcode $(xcodebuild -version | head -n1), iphoneos SDK $sdk"
      - name: Install the App Store Connect API key (never printed)
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8_BASE64" && test -n "$APPLE_TEAM_ID" \
            || { echo "::error::ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (secrets) and APPLE_TEAM_ID (variable) are required (ticket M0-REPO-05)"; exit 1; }
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          python3 - <<'PY'
          import base64, json, os
          key = base64.b64decode(os.environ["ASC_KEY_P8_BASE64"]).decode()
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": key, "in_house": False},
                    open(os.path.expanduser("~/private_keys/asc_api_key.json"), "w"))
          PY
          chmod 600 "$HOME/private_keys/asc_api_key.json"
      # Export compliance: the app only uses the OS's standard HTTPS/TLS (exempt),
      # so ITSAppUsesNonExemptEncryption=false lets TestFlight builds go straight
      # to testers instead of waiting on the "Missing Compliance" question in
      # App Store Connect. Revisit if the app ever ships its own cryptography.
      - name: Set the build number and export-compliance flag
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist || echo "::warning::could not set CFBundleVersion in Info.plist; gj-qa-release to confirm the build-number path on first run"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist
          echo "::notice::build $BUILD_NUMBER ($FLAVOR)"
      # The archive is built unsigned and signed once, at export, with an App Store
      # (distribution) profile via cloud-managed signing. A signed archive would
      # need an iOS App Development profile, which Apple only issues when the team
      # has a registered device ("Your team has no devices from which to generate
      # a provisioning profile", first TestFlight run 36467562336, 2026-09-28).
      - name: Archive (unsigned; signed at export)
        run: |
          set -euo pipefail
          cd build/iOS/GiganticJourneys
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath ../GiganticJourneys.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          # Export derives capability entitlements from the archived binary's signature,
          # so an unsigned archive would lose them: ad-hoc sign with the project's
          # entitlements first when there are any (none today).
          ent=$(find . -maxdepth 3 -name '*.entitlements' -not -path './DerivedData/*' | head -n1)
          if [ -n "$ent" ]; then
            codesign --force --sign - --entitlements "$ent" ../GiganticJourneys.xcarchive/Products/Applications/*.app
            echo "ad-hoc signed the archived app with $ent before export"
          fi
      - name: Export the .ipa (App Store distribution signing, cloud-managed)
        run: |
          set -euo pipefail
          internal_only=""
          if [ "$FLAVOR" = "internal-debug" ]; then
            internal_only="<key>testFlightInternalTestingOnly</key><true/>"
            echo "::notice::internal-debug flavor: exported as TestFlight internal-testing-only (debug overlay included)"
          fi
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            ${internal_only}
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/iOS/GiganticJourneys.xcarchive \
            -exportPath build/iOS/export -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload to TestFlight (fastlane pilot)
        run: |
          set -euo pipefail
          ipa=$(ls build/iOS/export/*.ipa | head -n1)
          fastlane pilot upload --api_key_path "$HOME/private_keys/asc_api_key.json" --ipa "$ipa" \
            --skip_waiting_for_build_processing true --skip_submission true
          echo "::notice::uploaded build $BUILD_NUMBER ($FLAVOR) to TestFlight"
      - name: Remove the key material
        if: always()
        run: rm -rf "$HOME/private_keys"
      # AUTH #047 / #046: private splat packages were in this Xcode project. The
      # job has already downloaded the artifact; delete it from the public repo
      # so it is not left downloadable (incident: build 58 / artifact 11323035373).
      - name: Delete the Xcode project artifact when it held private splat packages (AUTH #047)
        if: ${{ always() && inputs.flavor == 'internal-debug' && (inputs.splat_url != '' || inputs.splat_url_2 != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=ios-xcode-project-burst
          ids=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"             --paginate --jq '.artifacts[] | select(.name=="ios-xcode-project-burst") | .id')
          if [ -z "${ids}" ]; then
            echo "::warning::AUTH #047: no $name artifact on this run to delete"
            exit 0
          fi
          for id in $ids; do
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/${id}"
            echo "[GJ-FLAVOR] AUTH #047: deleted Actions artifact $name id=$id (private splat package(s) were in this run)"
            echo "::notice::deleted public artifact $name (id $id) - private splat packages must not remain downloadable"
          done

  gate:
    name: ios build gate
    needs: [preflight, export, archive, macos-player, testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.preflight.outputs.run }}" != "true" ]; then
            echo "skipped: ${{ needs.preflight.outputs.reason }}"
            exit 0
          fi
          fail=0
          if [ "${{ needs.preflight.outputs.linux }}" = "true" ]; then
            if [ "${{ needs.export.result }}/${{ needs.archive.result }}" != "success/success" ]; then
              echo "::error::Linux export lane failed (export=${{ needs.export.result }}, xcodebuild=${{ needs.archive.result }})"
              fail=1
            fi
          fi
          if [ "${{ needs.preflight.outputs.macos }}" = "true" ]; then
            if [ "${{ needs.macos-player.result }}" != "success" ]; then
              echo "::error::macOS player lane (Burst on) failed (${{ needs.macos-player.result }})"
              fail=1
            fi
            if [ "${{ vars.TESTFLIGHT_ENABLED }}" = "true" ] && [ "${{ needs.testflight.result }}" != "success" ]; then
              echo "::error::TestFlight lane failed (${{ needs.testflight.result }})"
              fail=1
            fi
          fi
          [ "$fail" = 0 ] && echo "ios build: OK (linux=${{ needs.preflight.outputs.linux }}, macos=${{ needs.preflight.outputs.macos }})"
          exit "$fail"
